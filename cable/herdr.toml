# herdr command palette — Television channel (ACTIONS surface, default).
# Source emits: LABEL<TAB>COMMAND lines (herdr-palette source).
# The switch/navigation surface lives in the separate `herdr-switch` channel,
# so this one stays a plain, single-purpose actions menu.
#
# @BIN@ is substituted with the resolved herdr-palette binary by
# scripts/install-channel.sh — do not hardcode a checkout path here.

[metadata]
name = "herdr"
description = "Herdr command palette: agents, panes, tabs, workspaces, server ops"
requirements = ["herdr"]

[source]
command = "@BIN@ source"
display = "{split:\t:0}"
no_sort = true  # preserve grouping order (ranked head, then catalog)

[preview]
command = "@BIN@ preview '{split:\t:1}'"

[ui]
preview_panel = { size = 55 }

[keybindings]
ctrl-e = "actions:run"

[actions.run]
description = "Execute the selected herdr command"
command = "@BIN@ select '{split:\t:1}' '{split:\t:0}'"
mode = "execute"
